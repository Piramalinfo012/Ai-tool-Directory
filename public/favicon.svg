<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- AI Gradient -->
    <linearGradient id="ai-grad" x1="12" y1="8" x2="52" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Hub Pill Gradient -->
    <linearGradient id="hub-bg" x1="10" y1="36" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.8" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="22" r="16" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="32" cy="46" r="14" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- Mini Spark Accent on Top Right -->
  <path d="M50 10C50 13 47 16 44 16C47 16 50 19 50 22C50 19 53 16 56 16C53 16 50 13 50 10Z" fill="#38bdf8" opacity="0.85" />

  <!-- "AI" Large Bold Typography -->
  <text 
    x="32" 
    y="29" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="1px" 
    fill="url(#ai-grad)"
  >AI</text>

  <!-- "HUB" Pill Badge Container -->
  <rect x="10" y="36" width="44" height="19" rx="6" fill="url(#hub-bg)" stroke="#34d399" stroke-width="1" />
  
  <!-- "HUB" Crisp Text -->
  <text 
    x="32" 
    y="50.5" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-size="12" 
    font-weight="900" 
    letter-spacing="2.2px" 
    fill="#ffffff"
  >HUB</text>
</svg>
